[package]
name = "light-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Light Studio: a photo planning app (Sun, Moon, Milky Way, terrain and shadows)"

[lints]
workspace = true

[dependencies]
light-studio-astro = { path = "../astro" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = "0.36"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
qrcode = { version = "0.14", default-features = false }
getrandom = "0.3"
log = "0.4"
web-time = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
tzf-rs = { version = "2.1.3", default-features = false, features = ["bundled"] }
chrono-tz = "0.10.4"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
sgp4 = "2.4.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
